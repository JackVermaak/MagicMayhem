name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rules:
    name: Game rules (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # The rules compile without Unity, so their NUnit tests run here without a Unity licence.
      - run: dotnet test dotnet-tests
